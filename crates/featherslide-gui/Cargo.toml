[package]
name = "featherslide-gui"
version = "0.1.0"
description = "Interface nativa Iced do FeatherSlide — leve, rápida e sem WebKit"
authors = ["FeatherSlide"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "featherslide"
path = "src/main.rs"

[dependencies]
feather-ui = { git = "https://github.com/feather-works/feather-ui", tag = "v0.2.10" }
feather-draw = { git = "https://github.com/feather-works/feather-draw", tag = "v0.1.1" }
feather-image = { git = "https://github.com/feather-works/feather-io", tag = "v0.1.3" }
featherslide-tabelas = { path = "../featherslide-tabelas" }
feather-tables = { git = "https://github.com/feather-works/feather-io", tag = "v0.1.3" }
featherslide-core = { path = "../featherslide-core" }
featherslide-ortografia = { path = "../featherslide-ortografia" }
featherslide-io = { path = "../featherslide-io" }
featherslide-mcp = { path = "../featherslide-mcp" }
iced = { version = "0.13", features = ["canvas", "image", "svg", "advanced", "tokio"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Iced, a decodificação e o desenho em build sem otimização são ordens de grandeza mais lentos
# (abrir arquivo, menu do botão direito): dependências e o próprio crate otimizados também no `cargo run`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
# Ícone e nome do .exe do Windows (build.rs).
embed-resource = "3"

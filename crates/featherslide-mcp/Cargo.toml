[package]
name = "featherslide-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Servidor MCP do FeatherSlide: deixa uma IA ver (imagem), editar e criar apresentações, localmente por stdio ou ao vivo no aplicativo."

# Só Rust puro e nada de rede: o servidor fala com quem o abriu por stdin/stdout ou canal local (socket Unix / TCP local com token).
# Nenhum conteúdo da apresentação sai da máquina.
[dependencies]
featherslide-core = { path = "../featherslide-core" }
featherslide-io = { path = "../featherslide-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
base64 = "0.22"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lib]
name = "featherslide_mcp"
path = "src/lib.rs"

[[bin]]
name = "featherslide-mcp"
path = "src/main.rs"

[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"

[package]
name = "featherslide-ortografia"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Verificação ortográfica do FeatherSlide: dicionários Hunspell lidos do disco, tudo local e em Rust puro."

# Só Rust puro e sem rede (regras 5 e 7 da suíte): `spellbook` lê os mesmos `.aff`/`.dic` do Hunspell.
[dependencies]
featherslide-core = { path = "../featherslide-core" }
spellbook = "0.4"

[lib]
name = "featherslide_ortografia"

[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"

[dev-dependencies]
featherslide-io = { path = "../featherslide-io" }

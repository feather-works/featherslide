[package]
name = "featherslide-pelicano"
version = "0.1.0"
description = "Interface nativa do FeatherSlide no pelicano, ao lado da versão Iced para comparar"
authors = ["FeatherSlide"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "featherslide-pelicano"
path = "src/main.rs"

[dependencies]
# shortcut: caminhos locais enquanto o pelicano novo e a porta do feather-ui não têm tag; trocar por git + tag ao publicar.
feather-ui = { path = "../../../feather-ui-pelicano" }
pelicano = { path = "../../../pelicano" }
feather-draw = { git = "https://github.com/feather-works/feather-draw", tag = "v0.1.1" }
feather-image = { git = "https://github.com/feather-works/feather-io", tag = "v0.1.3" }
featherslide-tabelas = { path = "../featherslide-tabelas" }
feather-tables = { git = "https://github.com/feather-works/feather-io", tag = "v0.1.3" }
featherslide-core = { path = "../featherslide-core" }
featherslide-ortografia = { path = "../featherslide-ortografia" }
featherslide-io = { path = "../featherslide-io" }
featherslide-mcp = { path = "../featherslide-mcp" }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# A interface, a decodificação e o desenho em build sem otimização são ordens de grandeza mais lentos
# (abrir arquivo, menu do botão direito): dependências e o próprio crate otimizados também no `cargo run`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

name: featherslide
title: FeatherSlide
base: core26 # mesma base e mesma placa de vídeo (gpu-2604) dos snaps do FeatherSheet e do FeatherPDF
version: '0.3.0' # trocar junto com a tag em `source:` a cada versão
summary: Local presentation editor, opens .pptx and .odp
description: |
  A presentation editor written in Rust with a native interface. Opens
  PowerPoint (.pptx) and Impress (.odp) files, saves .pptx and exports
  PDF. Shapes, tables, charts, diagrams, transitions, animations,
  presenter view, pen and laser pointer. Interface in English,
  Portuguese and Spanish.
  Everything runs on your machine: no account, no login, no telemetry.
license: GPL-3.0-only
website: https://maragon.dev
issues: https://github.com/feather-works/featherslide/issues
source-code: https://github.com/feather-works/featherslide
contact: mailto:contato@maragon.dev
icon: pacote/icones/featherslide-512.png
grade: stable
confinement: strict
platforms:
  amd64:

plugs:
  gpu-2604:
    interface: content
    target: $SNAP/gpu-2604
    default-provider: mesa-2604

layout:
  /usr/share/libdrm:
    bind: $SNAP/gpu-2604/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/gpu-2604/drirc.d
  # O Compose do pt_BR inclui o do en_US por caminho absoluto (acentos com tecla morta).
  /usr/share/X11/locale:
    bind: $SNAP/gpu-2604/mesa-2604/usr/share/X11/locale

apps:
  featherslide:
    command: usr/bin/featherslide
    command-chain: [bin/gpu-2604-wrapper, bin/janela.sh]
    desktop: usr/share/applications/featherslide.desktop
    common-id: featherslide
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - home
      - removable-media # arquivos em /media e /run/media
      - cups # imprimir (lp/lpstat)

parts:
  featherslide:
    # Reaproveita o .deb da release (feito pelo pacote/gerar.sh), sem recompilar.
    plugin: dump
    source: https://github.com/feather-works/featherslide/releases/download/v0.3.0/featherslide-linux-amd64.deb
    source-type: deb
    # Bibliotecas que o winit/wgpu e as fontes abrem por dlopen; lp/lpstat (impressão) e xrandr (monitores ao apresentar).
    stage-packages:
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libvulkan1
      - libfontconfig1
      - cups-client
      - x11-xserver-utils
    override-build: |
      craftctl default
      sed -i 's#^Icon=.*#Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/featherslide.png#' \
        ${CRAFT_PART_INSTALL}/usr/share/applications/featherslide.desktop

  janela:
    plugin: dump
    source: snap/local
    organize:
      janela.sh: bin/janela.sh

  gpu-2604:
    after: [featherslide]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2604-cleanup mesa-2604
    prime:
      - bin/gpu-2604-wrapper
